name: Release
# Push a tag like v1.0 and GitHub builds the program for Windows, Mac and Linux and the Python version, and attaches them to a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Check that initiative.html is built from src/
        run: python3 tools/build.py --check
      - name: Put the app into the program
        run: |
          mkdir -p go/assets
          cp initiative.html icon-192.png icon-512.png srd/srd-5.2.1.json go/assets/
          cp -r fonts go/assets/fonts
      - name: Build Roundkeeper.exe
        working-directory: go
        run: GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o Roundkeeper.exe .
      - name: Build for Mac (one universal program) and Linux
        working-directory: go
        env:
          CGO_ENABLED: "0"
        run: |
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o rk-mac-x86_64 .
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o rk-mac-arm64 .
          python3 ../tools/makefat.py Roundkeeper rk-mac-x86_64 rk-mac-arm64
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o roundkeeper .
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o roundkeeper-arm64 .
      - name: Write the version into the Python server
        # Settings → Updates compares it with the latest release; a build that isn't from a tag gets the branch name,
        # which isn't a version, so it never offers an update
        run: sed -i "s|^VERSION = \"dev\"|VERSION = \"${GITHUB_REF_NAME}\"|" server.py && grep -n '^VERSION = ' server.py
      - name: Zip
        run: |
          (cd go && zip -q ../Roundkeeper-mac.zip Roundkeeper)
          zip -q Roundkeeper-mac.zip README.md THIRD-PARTY-NOTICES.txt LICENSE
          (cd go && zip -q ../Roundkeeper-linux.zip roundkeeper roundkeeper-arm64)
          zip -q Roundkeeper-linux.zip README.md THIRD-PARTY-NOTICES.txt LICENSE
          (cd go && zip -q ../Roundkeeper-windows.zip Roundkeeper.exe)
          zip -q Roundkeeper-windows.zip README.md THIRD-PARTY-NOTICES.txt LICENSE allow-network.bat
          zip -qr Roundkeeper-python.zip initiative.html server.py start.bat allow-network.bat icon-192.png icon-512.png fonts srd README.md THIRD-PARTY-NOTICES.txt LICENSE
          sha256sum *.zip > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            Roundkeeper-windows.zip
            Roundkeeper-mac.zip
            Roundkeeper-linux.zip
            Roundkeeper-python.zip
            SHA256SUMS.txt
