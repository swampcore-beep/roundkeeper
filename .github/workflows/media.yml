name: Record media
# Makes the README pictures, GIFs and videos on GitHub's computer instead of the owner's, with dev/media/record.sh
# on the SRD-only test server. Nothing is committed: the files come back as the run's "media" artifact
# (out/readme: ready for media/ with the README's names; out/videos: the mp4s; out/stills: the screenshots).
# Start it in Actions → Record media → Run workflow, or from a session:
#   gh api -X POST repos/swampcore-beep/roundkeeper/actions/workflows/media.yml/dispatches -f ref=main -f inputs[what]="stills pictures"
# A pull request that changes this file or dev/media/ makes the stills and pictures, so a change to the scripts is tried here first.
# The preview job then writes key frames of the run to the media-preview branch, for Claude's sessions, which can't download
# artifacts (they come from *.blob.core.windows.net): git fetch --depth 1 origin media-preview. See its README.md.

on:
  workflow_dispatch:
    inputs:
      what:
        description: "What to make: stills pictures gifs four dm table phone home, or videos, or all"
        default: "stills pictures"
        required: true
  pull_request:
    paths:
      - .github/workflows/media.yml
      - dev/media/**

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Playwright, Chromium, ffmpeg
        run: |
          pip install playwright pillow numpy fonttools brotli
          python -m playwright install --with-deps chromium
          sudo apt-get update -q && sudo apt-get install -yq ffmpeg
      - name: Record
        env:
          WHAT: ${{ github.event_name == 'workflow_dispatch' && inputs.what || 'stills pictures' }}
        run: bash dev/media/record.sh $WHAT
      - name: The files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media
          path: dev/.work/media/out/
          retention-days: 14
          if-no-files-found: warn

  # Key frames of the videos and smaller copies of the pictures, on a branch with no history that each run rewrites.
  # Only this job may write, and it runs nothing from the app: it downloads the artifact, runs ffmpeg and pushes.
  # A run of one part keeps what the branch has for the others. Not for pull requests from forks.
  preview:
    needs: record
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: media-preview
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: media
          path: in
      - name: Key frames
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WHAT: ${{ github.event_name == 'workflow_dispatch' && inputs.what || 'stills pictures' }}
          REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -eu
          sudo apt-get update -q && sudo apt-get install -yq ffmpeg > /dev/null
          URL="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          RUN="${{ github.server_url }}/${REPO}/actions/runs/${{ github.run_id }}"
          STAMP="$RUN ($(date -u '+%Y-%m-%d %H:%M UTC'), parts: ${WHAT}, branch ${REF})"
          if git ls-remote --exit-code "$URL" refs/heads/media-preview > /dev/null; then
            git clone -q --depth 1 -b media-preview "$URL" pv && rm -rf pv/.git
          else mkdir pv; fi
          for v in in/videos/*.mp4; do
            [ -f "$v" ] || continue; n=$(basename "$v" .mp4); d=pv/videos/$n; rm -rf "$d"; mkdir -p "$d"
            ffmpeg -loglevel error -i "$v" -vf "fps=1/3,scale=1280:-2" -q:v 5 "$d/%03d.jpg"
            ffmpeg -loglevel error -i "$v" -vf "fps=1/4,scale=480:-2,tile=4x6" -q:v 4 "$d/sheet-%02d.jpg"
            dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$v")
            { echo "$STAMP"; echo "${n}.mp4: ${dur%.*} s, $(du -k "$v" | cut -f1) KB."
              echo "NNN.jpg is the frame at (NNN-1)*3 s; each sheet-NN.jpg holds 24 frames 4 s apart, left to right."; } > "$d/run.txt"
          done
          if ls in/stills/*.png > /dev/null 2>&1; then rm -rf pv/stills; mkdir -p pv/stills
            for p in in/stills/*.png; do ffmpeg -loglevel error -i "$p" -vf "scale='min(1280,iw)':-2" -q:v 4 "pv/stills/$(basename "$p" .png).jpg"; done
            echo "$STAMP" > pv/stills/run.txt; fi
          if [ -d in/readme ]; then rm -rf pv/readme; cp -r in/readme pv/readme; echo "$STAMP" > pv/readme/run.txt; fi
          cd pv
          { echo "# media-preview"; echo
            echo "Key frames and pictures from the Record media workflow, for review; nothing here goes in the README."
            echo "Each run rewrites this branch (no history) and replaces only the folders it made."; echo
            echo "Last run: $STAMP"; echo
            for r in videos/*/run.txt stills/run.txt readme/run.txt; do if [ -f "$r" ]; then echo "- \`$(dirname "$r")\`: $(head -1 "$r")"; fi; done
          } > README.md
          git init -q -b media-preview && git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Preview of run ${{ github.run_id }}"
          git push -qf "$URL" media-preview
