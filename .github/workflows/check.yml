name: Check
# On every pull request: initiative.html must be the file tools/build.py puts together from src/.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: initiative.html is built from src/
        run: python3 tools/build.py --check
